name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
      - run: uv sync --locked --no-editable --python 3.12
      - run: uv run --no-editable ruff check src tests scripts
      - run: uv run --no-editable ruff format --check src tests scripts
      - run: uv run --no-editable pytest -q

  data-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
      - run: uv sync --locked --no-editable --python 3.12
      - run: uv run --no-editable ace-rag fetch-data
      - run: uv run --no-editable ace-rag profile-data --output runs/ci/dataset_profile.json
      - run: uv run --no-editable ace-rag smoke --output runs/ci/smoke
      - run: uv run --no-editable python scripts/verify_smoke.py --run runs/ci/smoke
      - run: uv run --locked --no-editable --extra selection ace-rag fetch-selection
      - run: uv run --locked --no-editable --extra selection ace-rag selection-smoke --output runs/ci/selection
      - run: uv run --locked --no-editable --extra selection python scripts/verify_selection.py --run runs/ci/selection
      - run: uv run --locked --no-editable ace-rag routing-smoke --output runs/ci/routing
      - run: uv run --locked --no-editable python scripts/verify_routing.py --run runs/ci/routing
      - run: uv run --locked --no-editable --extra generation python scripts/generated_preflight.py --output runs/ci/generated-preflight
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: phase1-real-data-smoke
          path: runs/ci/
          retention-days: 7

  finance-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
      - run: uv sync --locked --no-editable --python 3.12
      - run: uv run --no-editable ace-rag fetch-finance
      - run: uv run --no-editable ace-rag finance-smoke --output runs/ci/finance_smoke.json
      - run: uv run --locked --no-editable python scripts/prices_smoke.py --output runs/ci/prices_smoke.json
      - run: uv run --locked --no-editable ace-rag fetch-data
      - run: uv run --locked --no-editable python scripts/price_eligibility_audit.py --output runs/ci/price_eligibility.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: phase1-real-finance-smoke
          path: |
            runs/ci/finance_smoke.json
            runs/ci/prices_smoke.json
            runs/ci/price_eligibility.json
          retention-days: 7
