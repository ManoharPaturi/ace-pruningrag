name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
      - run: uv sync --locked --no-editable --extra demo --extra constraints --python 3.12
      - run: uv run --no-editable ruff check src tests scripts
      - run: uv run --no-editable ruff format --check src tests scripts
      - run: uv run --no-editable --extra demo --extra constraints pytest -q
      - run: uv run --locked --no-editable python scripts/build_research_report.py --output runs/ci/research-status.md --manifest runs/ci/report-manifest.json
      - run: cmp docs/RESEARCH_STATUS_REPORT.md runs/ci/research-status.md
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  data-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
      - run: uv sync --locked --no-editable --python 3.12
      - run: uv run --no-editable ace-rag fetch-data
      - run: uv run --locked --no-editable python scripts/prospective_evaluation.py freeze --output runs/ci/prospective
      - run: uv run --locked --no-editable python scripts/prospective_evaluation.py verify --packet runs/ci/prospective/packet.json --output runs/ci/prospective-verified
      - run: uv run --no-editable ace-rag profile-data --output runs/ci/dataset_profile.json
      - run: uv run --no-editable ace-rag smoke --output runs/ci/smoke
      - run: uv run --no-editable python scripts/verify_smoke.py --run runs/ci/smoke
      - run: uv run --locked --no-editable --extra selection ace-rag fetch-selection
      - run: uv run --locked --no-editable --extra selection ace-rag selection-smoke --output runs/ci/selection
      - run: uv run --locked --no-editable --extra selection python scripts/verify_selection.py --run runs/ci/selection
      - run: uv run --locked --no-editable ace-rag routing-smoke --output runs/ci/routing
      - run: uv run --locked --no-editable python scripts/verify_routing.py --run runs/ci/routing
      - run: uv run --locked --no-editable --extra generation python scripts/generated_preflight.py --output runs/ci/generated-preflight
      - run: uv run --locked --no-editable --extra generation python scripts/cohort_preflight.py --output runs/ci/cohort-preflight
      - run: uv run --locked --no-editable python scripts/fetch_movie_assets.py --output runs/ci/movie-assets.json
      - run: uv run --locked --no-editable python scripts/build_movie_index.py --output data/crag/movie/snapshot.sqlite --manifest runs/ci/movie-index.json
      - run: uv run --locked --no-editable python scripts/movie_snapshot_smoke.py --index data/crag/movie/snapshot.sqlite --manifest runs/ci/movie-index.json --output runs/ci/movie-http.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: phase1-real-data-smoke
          path: runs/ci/
          retention-days: 7

  finance-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
      - run: uv sync --locked --no-editable --python 3.12
      - run: uv run --no-editable ace-rag fetch-finance
      - run: uv run --no-editable ace-rag finance-smoke --output runs/ci/finance_smoke.json
      - run: uv run --locked --no-editable python scripts/prices_smoke.py --output runs/ci/prices_smoke.json
      - run: uv run --locked --no-editable ace-rag fetch-data
      - run: uv run --locked --no-editable python scripts/price_eligibility_audit.py --output runs/ci/price_eligibility.json
      - run: uv run --locked --no-editable --extra generation python scripts/historical_preflight.py --retry --output runs/ci/historical-preflight
      - run: uv run --locked --no-editable python scripts/reliability_replay.py --input runs/ci/historical-preflight/prepared.jsonl --output runs/ci/reliability
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: phase1-real-finance-smoke
          path: |
            runs/ci/finance_smoke.json
            runs/ci/prices_smoke.json
            runs/ci/price_eligibility.json
            runs/ci/historical-preflight/
            runs/ci/reliability/
          retention-days: 7
