[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ace-pruningrag"
version = "0.1.0"
description = "Reproducible cross-source evidence selection research"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
selection = ["tokenizers==0.22.1"]
generation = ["transformers==4.57.3", "huggingface-hub==0.36.0", "tokenizers==0.22.1", "safetensors==0.6.2", "sentencepiece==0.2.1", "jinja2==3.1.6"]

[project.scripts]
ace-rag = "ace_pruningrag.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ace_pruningrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
